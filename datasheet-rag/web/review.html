<style>
/* Dark slate by default (the design system's "Dark Mode" for developer tools); a light theme on the toggle. */
:root, [data-theme="dark"] {
  color-scheme: dark;
  --bg: #0B1120; --bg-raised: #0F172A; --panel: #131C2E; --panel-hover: #18233A; --inset: #0D1526;
  --line: #1F2A40; --line-strong: #2C3A55;
  --text: #E7ECF4; --text-muted: #9AA8BF; --text-faint: #6B7A93;
  --accent: #3B82F6; --accent-hover: #2F72E4; --accent-soft: rgba(59, 130, 246, 0.14); --accent-text: #8DB6FF;
  --ok: #22C55E; --ok-soft: rgba(34, 197, 94, 0.13); --ok-text: #6EE7A0;
  --warn: #F59E0B; --warn-soft: rgba(245, 158, 11, 0.13); --warn-text: #FCD181;
  --bad: #EF4444; --bad-soft: rgba(239, 68, 68, 0.13); --bad-text: #FCA5A5;
  --shadow: 0 1px 2px rgba(0, 0, 0, 0.4), 0 12px 32px -16px rgba(0, 0, 0, 0.6);
  --skeleton: #1A2438;
}
[data-theme="light"] {
  color-scheme: light;
  --bg: #F5F7FB; --bg-raised: #FFFFFF; --panel: #FFFFFF; --panel-hover: #F3F6FB; --inset: #F1F4F9;
  --line: #E3E8EF; --line-strong: #CBD5E1;
  --text: #0F172A; --text-muted: #51607A; --text-faint: #7D8BA3;
  --accent: #2563EB; --accent-hover: #1D4ED8; --accent-soft: #EAF1FF; --accent-text: #1D4ED8;
  --ok: #16A34A; --ok-soft: #EAF8EF; --ok-text: #067647;
  --warn: #D97706; --warn-soft: #FFF6E5; --warn-text: #8A5A00;
  --bad: #DC2626; --bad-soft: #FEF0F0; --bad-text: #B42318;
  --shadow: 0 1px 2px rgba(15, 23, 42, 0.05), 0 12px 32px -16px rgba(15, 23, 42, 0.16);
  --skeleton: #E9EEF5;
}
:root {
  --radius: 12px; --radius-sm: 8px;
  --font: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Consolas, monospace;
  --ease: cubic-bezier(0.2, 0.8, 0.2, 1);
}
*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; font: 400 15px/1.55 var(--font); color: var(--text); background: var(--bg); -webkit-font-smoothing: antialiased; }
button, select, textarea, input { font: inherit; color: inherit; }
a { color: var(--accent-text); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
.icon { width: 16px; height: 16px; flex: none; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.mono { font-family: var(--mono); font-size: 0.86em; }
.visually-hidden { position: absolute; width: 1px; height: 1px; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* ===== Shell: sidebar + main ===== */
.shell { display: grid; grid-template-columns: 232px minmax(0, 1fr); min-height: 100%; }
.sidebar { position: sticky; top: 0; height: 100vh; display: flex; flex-direction: column; gap: 4px; padding: 18px 12px; background: var(--bg-raised); border-right: 1px solid var(--line); }
.brand { display: flex; align-items: center; gap: 10px; padding: 4px 10px 18px; font-weight: 600; color: var(--text); text-decoration: none; }
.brand-mark { display: grid; place-items: center; width: 28px; height: 28px; border-radius: 8px; background: var(--accent); color: #fff; }
.brand small { display: block; font-size: 12px; font-weight: 500; color: var(--text-faint); }
.nav { display: grid; gap: 2px; }
.nav button { display: flex; align-items: center; gap: 10px; width: 100%; height: 38px; padding: 0 10px; font-weight: 500; color: var(--text-muted); background: transparent; border: 0; border-radius: var(--radius-sm); cursor: pointer; transition: background-color 150ms, color 150ms; }
.nav button:hover { color: var(--text); background: var(--panel-hover); }
.nav button[aria-current="page"] { color: var(--text); background: var(--accent-soft); }
.nav button[aria-current="page"] .icon { color: var(--accent-text); }
.nav .count { margin-left: auto; min-width: 22px; padding: 0 7px; font: 600 12px/20px var(--mono); text-align: center; color: var(--text-muted); background: var(--inset); border-radius: 999px; }
.nav .count:empty { display: none; }
.sidebar-foot { margin-top: auto; display: grid; gap: 8px; padding: 12px 10px 0; border-top: 1px solid var(--line); font-size: 13px; color: var(--text-faint); }
.sidebar-foot .row { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.main { min-width: 0; padding: 28px 32px 64px; }
.page-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: 20px; }
h1 { margin: 0; font-size: 1.45rem; font-weight: 600; letter-spacing: -0.015em; }
.page-head p { margin: 4px 0 0; color: var(--text-muted); font-size: 14px; max-width: 640px; }
.kbd { display: inline-flex; align-items: center; justify-content: center; min-width: 20px; height: 20px; padding: 0 5px; font: 500 11px/1 var(--mono); color: var(--text-muted); background: var(--inset); border: 1px solid var(--line-strong); border-bottom-width: 2px; border-radius: 5px; }
.hint { font-size: 12px; color: var(--text-faint); display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }

/* ===== Buttons and fields ===== */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 36px; padding: 0 14px; font-size: 14px; font-weight: 600; color: #fff; background: var(--accent); border: 1px solid transparent; border-radius: var(--radius-sm); cursor: pointer; transition: background-color 150ms, border-color 150ms, transform 80ms; }
.btn:hover { background: var(--accent-hover); }
.btn:active { transform: translateY(1px); }
.btn[disabled] { opacity: 0.55; cursor: progress; }
.btn-ghost { color: var(--text); background: transparent; border-color: var(--line-strong); }
.btn-ghost:hover { background: var(--panel-hover); }
.btn-danger { color: var(--bad-text); background: transparent; border-color: color-mix(in srgb, var(--bad) 45%, transparent); }
.btn-danger:hover { background: var(--bad-soft); }
.btn-sm { height: 30px; padding: 0 10px; font-size: 13px; }
.icon-btn { display: grid; place-items: center; width: 34px; height: 34px; color: var(--text-muted); background: transparent; border: 1px solid var(--line); border-radius: var(--radius-sm); cursor: pointer; transition: background-color 150ms, color 150ms; }
.icon-btn:hover { color: var(--text); background: var(--panel-hover); }
label.field { display: grid; gap: 6px; font-size: 12px; font-weight: 600; letter-spacing: 0.03em; text-transform: uppercase; color: var(--text-faint); }
input[type="text"], input[type="number"], select, textarea { width: 100%; padding: 9px 11px; font-size: 14px; color: var(--text); background: var(--inset); border: 1px solid var(--line); border-radius: var(--radius-sm); transition: border-color 150ms, box-shadow 150ms; }
input:focus, select:focus, textarea:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
textarea { min-height: 96px; resize: vertical; line-height: 1.5; }
.field-hint { margin: 0; font-size: 12px; font-weight: 400; letter-spacing: 0; text-transform: none; color: var(--text-faint); }
.check { display: flex; align-items: flex-start; gap: 10px; font-size: 14px; color: var(--text); cursor: pointer; }
.check input { width: 16px; height: 16px; margin-top: 3px; accent-color: var(--accent); }

/* ===== Panels, chips ===== */
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); }
.chip { display: inline-flex; align-items: center; gap: 6px; height: 22px; padding: 0 9px; font-size: 12px; font-weight: 600; white-space: nowrap; color: var(--text-muted); background: var(--inset); border: 1px solid var(--line); border-radius: 999px; }
.chip::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; opacity: 0.85; }
.chip.plain::before { display: none; }
.chip.ok { color: var(--ok-text); background: var(--ok-soft); border-color: transparent; }
.chip.warn { color: var(--warn-text); background: var(--warn-soft); border-color: transparent; }
.chip.bad { color: var(--bad-text); background: var(--bad-soft); border-color: transparent; }
.chip.info { color: var(--accent-text); background: var(--accent-soft); border-color: transparent; }
.chip.live::before { animation: pulse 1.2s ease-in-out infinite; }
@keyframes pulse { 50% { opacity: 0.25; } }
.meta { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 12px; font-size: 13px; color: var(--text-muted); }
.sep { color: var(--text-faint); }

/* ===== Queue: list + detail ===== */
.split { display: grid; grid-template-columns: minmax(260px, 340px) minmax(0, 1fr); gap: 16px; align-items: start; }
.list { display: grid; gap: 6px; max-height: calc(100vh - 150px); overflow: auto; padding: 2px; scrollbar-width: thin; }
.item { display: grid; gap: 6px; width: 100%; padding: 12px 14px; text-align: left; background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius-sm); cursor: pointer; transition: border-color 150ms, background-color 150ms; }
.item:hover { background: var(--panel-hover); }
.item[aria-selected="true"] { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.item-q { font-size: 14px; font-weight: 500; line-height: 1.4; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.item-meta { display: flex; align-items: center; flex-wrap: wrap; gap: 4px 8px; font-size: 12px; color: var(--text-faint); }
.item-meta > span { white-space: nowrap; }
.item-meta .chip { height: 20px; font-size: 11px; }
.detail { padding: 22px 24px; display: grid; gap: 18px; position: sticky; top: 20px; }
.section-title { margin: 0 0 8px; font-size: 12px; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; color: var(--text-faint); }
.question { margin: 0; font-size: 1.12rem; font-weight: 600; line-height: 1.45; overflow-wrap: anywhere; }
.answer { margin: 0; padding: 14px 16px; white-space: pre-wrap; overflow-wrap: anywhere; background: var(--inset); border: 1px solid var(--line); border-radius: var(--radius-sm); }
.sources { display: flex; flex-wrap: wrap; gap: 6px; }
.comment { padding: 12px 14px; background: var(--warn-soft); border-left: 3px solid var(--warn); border-radius: var(--radius-sm); color: var(--text); white-space: pre-wrap; overflow-wrap: anywhere; }
.comment b { display: block; margin-bottom: 4px; font-size: 12px; letter-spacing: 0.04em; text-transform: uppercase; color: var(--warn-text); }
details.passages summary { cursor: pointer; font-size: 13px; font-weight: 500; color: var(--text-muted); list-style: none; display: flex; align-items: center; gap: 6px; }
details.passages summary::-webkit-details-marker { display: none; }
details.passages summary .icon { transition: transform 200ms var(--ease); }
details.passages[open] summary .icon { transform: rotate(90deg); }
.passage { margin-top: 8px; padding: 10px 12px; font-size: 13px; line-height: 1.5; white-space: pre-wrap; overflow-wrap: anywhere; background: var(--inset); border: 1px solid var(--line); border-radius: var(--radius-sm); }
.passage b { display: block; margin-bottom: 4px; font-family: var(--mono); font-size: 12px; font-weight: 500; color: var(--accent-text); }
.passage.note b { color: var(--ok-text); }
.choices { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 8px; }
.choice { display: flex; align-items: center; gap: 10px; padding: 10px 12px; font-size: 14px; text-align: left; background: var(--inset); border: 1px solid var(--line); border-radius: var(--radius-sm); cursor: pointer; transition: border-color 150ms, background-color 150ms; }
.choice:hover { border-color: var(--line-strong); background: var(--panel-hover); }
.choice[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); }
.choice .kbd { flex: none; }
.choice small { display: block; font-size: 12px; color: var(--text-faint); }
.inline { display: flex; gap: 8px; align-items: center; }
.inline input { flex: 1; }
.form-grid { display: grid; gap: 14px; }
.form-row { display: grid; grid-template-columns: minmax(0, 2fr) 120px auto; gap: 10px; align-items: end; }
.page-box { max-height: 280px; overflow: auto; display: grid; gap: 6px; padding: 10px; background: var(--inset); border: 1px dashed var(--line-strong); border-radius: var(--radius-sm); }
.page-box p { margin: 0; font-size: 13px; white-space: pre-wrap; overflow-wrap: anywhere; color: var(--text-muted); }
.empty-state { display: grid; place-items: center; gap: 8px; padding: 56px 20px; text-align: center; color: var(--text-muted); }
.empty-state .icon { width: 28px; height: 28px; color: var(--ok); }
.empty-state strong { color: var(--text); font-size: 15px; }

/* ===== Notes ===== */
.notes { display: grid; gap: 10px; }
.note-card { padding: 16px 18px; display: grid; gap: 10px; }
.note-head { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.note-head .grow { flex: 1; }
.note-text { margin: 0; font-size: 14px; white-space: pre-wrap; overflow-wrap: anywhere; }
.pipes { display: flex; gap: 14px; flex-wrap: wrap; font-size: 13px; color: var(--text-muted); }
.pipe { display: inline-flex; align-items: center; gap: 6px; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--text-faint); }
.dot.ok { background: var(--ok); } .dot.warn { background: var(--warn); } .dot.bad { background: var(--bad); }
.error-line { margin: 0; padding: 8px 10px; font-size: 13px; color: var(--bad-text); background: var(--bad-soft); border-radius: var(--radius-sm); }
.filters { display: flex; gap: 4px; padding: 3px; background: var(--inset); border: 1px solid var(--line); border-radius: 10px; }
.filters button { height: 28px; padding: 0 12px; font-size: 13px; font-weight: 500; color: var(--text-muted); background: transparent; border: 0; border-radius: 7px; cursor: pointer; }
.filters button[aria-pressed="true"] { color: var(--text); background: var(--panel); box-shadow: var(--shadow); }

/* ===== Report ===== */
.stats { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 12px; }
.stat { padding: 16px 18px; }
.stat h3 { margin: 0 0 6px; font-size: 12px; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; color: var(--text-faint); }
.stat .big { font: 600 1.7rem/1.1 var(--mono); letter-spacing: -0.02em; }
.stat .sub { margin-top: 4px; font-size: 13px; color: var(--text-muted); }
.bars { display: grid; gap: 8px; margin-top: 6px; }
.bar { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 10px; font-size: 13px; }
.bar span:first-child { color: var(--text-muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.bar .track { grid-column: 1 / -1; height: 6px; background: var(--inset); border-radius: 999px; overflow: hidden; }
.bar .fill { height: 100%; background: var(--accent); border-radius: 999px; transform-origin: left; animation: grow 500ms var(--ease); }
@keyframes grow { from { transform: scaleX(0); } }

/* ===== Login, skeleton, toasts ===== */
.login { display: grid; place-items: center; min-height: 100vh; padding: 16px; }
.login .panel { width: min(400px, 100%); padding: 32px; display: grid; gap: 16px; text-align: center; }
.login h1 { font-size: 1.3rem; }
.login p { margin: 0; color: var(--text-muted); font-size: 14px; }
.skeleton { display: grid; gap: 10px; }
.skeleton span { display: block; height: 14px; border-radius: 6px; background: linear-gradient(90deg, var(--skeleton), var(--panel-hover), var(--skeleton)); background-size: 200% 100%; animation: shimmer 1.3s linear infinite; }
.skeleton span:nth-child(2) { width: 85%; } .skeleton span:nth-child(3) { width: 60%; }
@keyframes shimmer { to { background-position: -200% 0; } }
.toasts { position: fixed; right: 20px; bottom: 20px; z-index: 50; display: grid; gap: 8px; width: min(360px, calc(100vw - 32px)); }
.toast { display: flex; align-items: flex-start; gap: 10px; padding: 12px 14px; font-size: 14px; background: var(--panel); border: 1px solid var(--line-strong); border-radius: var(--radius-sm); box-shadow: var(--shadow); animation: toast-in 220ms var(--ease); }
.toast.ok .icon { color: var(--ok); } .toast.bad .icon { color: var(--bad); }
.toast.leaving { animation: toast-out 160ms ease-in forwards; }
@keyframes toast-in { from { opacity: 0; transform: translateY(8px) scale(0.98); } }
@keyframes toast-out { to { opacity: 0; transform: translateY(4px); } }
.fade-in { animation: fade 200ms var(--ease); }
@keyframes fade { from { opacity: 0; transform: translateY(4px); } }

@media (max-width: 1000px) {
  .split { grid-template-columns: 1fr; }
  .list { max-height: none; }
  .detail { position: static; }
}
@media (max-width: 760px) {
  .shell { grid-template-columns: 1fr; }
  .sidebar { position: static; height: auto; flex-direction: row; flex-wrap: wrap; align-items: center; gap: 8px; padding: 10px 12px; border-right: 0; border-bottom: 1px solid var(--line); }
  .brand { padding: 0; flex: 1; }
  .brand small { display: none; }
  .nav { grid-auto-flow: column; width: 100%; order: 3; }
  .nav button { justify-content: center; }
  .nav .count { margin-left: 2px; }
  .sidebar-foot { margin: 0; padding: 0; border: 0; }
  .sidebar-foot .who-label { display: none; }
  .main { padding: 18px 16px 48px; }
  .form-row { grid-template-columns: 1fr 1fr; }
  .form-row .btn { grid-column: 1 / -1; }
  .hint.keys { display: none; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; transition-duration: 0.01ms !important; }
}
</style>
</head>

<script>
(() => {
  "use strict";
  // config.DOCUMENTS (tests/test_page.py keeps them equal to the main page's list).
  const DOCUMENTS = [
    ["esp32_datasheet_en", "ESP32"],
    ["DS_CD00237391", "STM32F205/207"],
    ["lm35", "LM35"],
    ["TCTH022BE_datasheet_en_20230425", "TCTH0xxxE"],
  ];
  // config.DIAGNOSES, in order (tests/test_page.py); the first two close the item, the others lead to a note.
  const DIAGNOSIS_TEXT = {
    correct: "The answer was correct",

      // One set of buttons per state: not yet live -> Publish and Discard; publishing or live -> Retract only.
      const actions = el("span", { class: "inline" });
      const notLive = ["draft", "failed", "retracted"].includes(note.status);
      if (notLive) {
        const b = el("button", { type: "button", class: "btn btn-sm", onclick: () => noteAction(note, "publish", b) }, "Publish");
        actions.append(b);
      }
      if (["published", "ingesting", "publishing"].includes(note.status) || unfinishedRetract(note)) {
        const b = el("button", { type: "button", class: "btn btn-sm btn-danger", onclick: () => noteAction(note, "retract", b) },
          unfinishedRetract(note) ? "Finish retract" : "Retract");
        actions.append(b);
      }
      if (notLive) {
        // Two clicks, no browser dialog: the first arms it for a few seconds.
        const b = el("button", { type: "button", class: "btn btn-sm btn-ghost",
          title: "Throw the note away and send its thumbs-down back to the queue" }, "Discard");
        b.addEventListener("click", () => {
          if (b.dataset.armed) { noteAction(note, "discard", b); return; }
          b.dataset.armed = "1";
          b.textContent = "Click again to discard";
          setTimeout(() => { delete b.dataset.armed; b.textContent = "Discard"; }, 3500);
        });
        actions.append(b);
      }
      // Only a published note reaches answers: a side that found its question is "ready, not live" until then.
      const live = note.status === "published";
      const sideText = (value) => value === "off" && !live ? "not published" : value === "ready" && !live ? "ready, not live"
        : SIDE_TEXT[value] || value || "–";
      const side = (name, value, score) => unfinishedRetract(note) && name === "Custom pipeline"
        ? el("span", { class: "pipe" }, el("span", { class: "dot warn" }), `${name}: ${SIDE_TEXT.retracting}`)
        : el("span", { class: "pipe" },
        el("span", { class: `dot ${value === "ready" && !live ? "" : SIDE[value] || ""}` }),
        `${name}: ${sideText(value)}`, score ? el("span", { class: "mono", text: ` ${score}` }) : null);
      return el("article", { class: "panel note-card fade-in" },
        el("div", { class: "note-head" },
          el("span", { class: `chip ${STATUS[note.status] || "plain"}`, text: note.status }),
          el("span", { class: "chip plain", text: `${partOf(note.document)} · p.${note.page}` }),
          el("span", { class: "meta grow", text: `${DIAGNOSIS_TEXT[note.diagnosis] || ""} · ${ago(note.published_at || note.created_at)}` }),
          actions),
        el("p", { class: "note-text", text: note.text }),
        el("div", { class: "meta", text: `For: ${note.question}` }),
        el("div", { class: "pipes" }, side("Custom pipeline", note.ours, note.ours_similarity), side("AWS managed", note.kb, note.kb === "ready" ? note.ours_similarity : note.kb_score)),
        note.error ? el("p", { class: "error-line", text: note.error }) : null);
    })));
  }

  // ---------- report ----------
  function bars(object) {
    const entries = Object.entries(object || {}).sort((a, b) => b[1] - a[1]);
    if (!entries.length) return el("div", { class: "sub", text: "None yet" });
    const top = Math.max(...entries.map(([, n]) => n));
    return el("div", { class: "bars" }, entries.map(([name, n]) => el("div", { class: "bar" },
      el("span", { text: DIAGNOSIS_TEXT[name] || name.replace(/_/g, " ") }), el("span", { class: "mono", text: String(n) }),
      el("div", { class: "track" }, el("div", { class: "fill", style: `width:${(n / top) * 100}%` })))));
  }
  function renderReport() {
    if (!state.report) { mainNode.replaceChildren(head("report"), el("div", { class: "stats" }, [1, 2, 3].map(() => el("div", { class: "panel stat" }, skeleton(2))))); return; }
    const r = state.report;
    const stat = (title, big, sub, extra) => el("div", { class: "panel stat fade-in" }, el("h3", { text: title }),
      big !== null ? el("div", { class: "big", text: big }) : null, sub ? el("div", { class: "sub", text: sub }) : null, extra || null);
    const rate = (p) => p.down_rate === null ? "–" : `${Math.round(p.down_rate * 100)}%`;
    mainNode.replaceChildren(head("report"), el("div", { class: "stats" },
      stat("Answers saved", String(r.answers), `${r.answers_with_notes} used a note · kept ${r.kept_days.answers} days`),
      ...Object.entries(r.pipelines).map(([name, p]) => stat(name === "kb" ? "AWS managed" : "Custom pipeline", rate(p),
        `thumbs-down rate · ${p.down} of ${p.rated} rated · ${p.answers} answers`)),
      stat("Answers that used a note", `${r.rated_with_notes.down} / ${r.rated_with_notes.rated}`, "thumbs-down / rated"),
      stat("Thumbs-down reasons", null, null, bars(r.reasons)),
      stat("Diagnoses", null, null, bars(r.diagnoses)),
      stat("Notes", null, null, bars(r.notes))));
  }

  const RENDER = { queue: renderQueue, notes: renderNotes, report: renderReport };

  // ---------- start ----------
  function loginScreen(message) {
    root.replaceChildren(el("div", { class: "login" }, el("div", { class: "panel fade-in" },
      el("span", { class: "brand-mark", style: "margin:0 auto;width:40px;height:40px" }, icon("lock")),
      el("h1", { text: "Reviewers only" }),
      el("p", { text: message || "Log in with a reviewer's account to read the feedback and publish notes." }),
      el("button", { type: "button", class: "btn", onclick: login }, "Log in"))));
  }
  async function start() {
    try {
      const response = await fetch("/api/review/config");
      settings = await response.json();
      if (!response.ok) throw new Error(settings.error || `The server answered ${response.status}.`);
      if (settings.auth) {
        const params = new URLSearchParams(location.search);
        if (params.get("code")) await finishLogin(params.get("code"), params.get("state"));
        token = savedToken();
        if (!token) { loginScreen(); return; }
      }
      const fromLink = location.hash.slice(1);
      if (VIEWS[fromLink]) state.view = fromLink;
      shell();
      render();
      refresh("queue");
      refresh("notes");
      if (state.view === "report") refresh("report");
    } catch (error) {
      if (settings.auth) loginScreen(error.message);
      else root.replaceChildren(el("div", { class: "login" }, errorPanel(error, () => location.reload())));
    }
  }
  start();
})();
</script>
</body>
</html>
