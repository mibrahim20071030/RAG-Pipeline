name: tests

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: .github/workflows/tests.yml

      # Same packages as the local venv (see CLAUDE.md, Layer 0), plus the linter.
      # ruff is pinned to the local version so new default rules cannot fail a PR on their own.
      - name: Install dependencies
        run: pip install pdfplumber "psycopg[binary]" boto3 numpy pytest ruff==0.17.0

      # The two steps below mirror tools/checks.py: ruff from the repo root (so ruff.toml
      # applies and tools/ is linted too), pytest from datasheet-rag.
      - name: Lint (ruff)
        run: python -m ruff check --output-format concise .

      # No AWS credentials, database or datasheet PDFs exist here. The tests that read
      # the PDFs skip themselves; nothing in tests/ calls AWS or Postgres.
      - name: Tests (pytest)
        working-directory: datasheet-rag
        run: python -m pytest -q -rs
